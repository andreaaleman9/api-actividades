name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm ci

    - name: Generar cliente de Prisma
      run: npx prisma generate

    - name: Verificar presencia de archivos requeridos (.env.example y BACKUPS.md)
      run: |
        test -f .env.example || (echo "Error: Falta .env.example" && exit 1)
        test -f BACKUPS.md || (echo "Error: Falta BACKUPS.md" && exit 1)
        echo "✅ Validaciones de archivos completadas con éxito."